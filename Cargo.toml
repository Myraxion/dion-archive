[package]
name = "dion"
version = "0.1.0"
edition = "2021"
authors = ["Dion Contributors"]
description = "Lightweight, high-performance Windows native CLI for Total Commander UTF-8 descript.ion comments"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
